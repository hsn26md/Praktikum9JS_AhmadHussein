<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6e6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4682b4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #315f85;
        }

        #halaman-sukses {
            display: none;
            text-align: center;
            color: #2e8b57;
        }
    </style>
</head>
<body>

    <div class="login-card" id="form-login">
        <h2>Login Authentication</h2>
        <p>username: ucennn
        <br>password: ucennn123
        </p>
        
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Masukkan username..." required>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Masukkan password..." required>

            <button type="button" onclick="login()">Login</button>
        </form>
    </div>

    <div id="halaman-sukses">
        <h1>Login Berhasil</h1>
        <h2>Login Sukses</h2>
    </div>

    <script>
        function login() {

            let usernameInput = document.getElementById("username").value;
            let passwordInput = document.getElementById("password").value;

            let usernameBenar = "ucennn";
            let passwordBenar = "ucennn123";

            if (usernameInput == usernameBenar && passwordInput == passwordBenar) {
                
                alert("Login Sukses");

                document.getElementById("form-login").style.display = "none";
                document.getElementById("halaman-sukses").style.display = "block";

            } else {
                
                alert("Login Gagal! Username atau Password salah.");

            }
        }
    </script>
</body>
</html>
