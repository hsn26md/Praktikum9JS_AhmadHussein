<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KursRupiah</title>
</head>
<body>
    <form style="background-color: rgb(200, 202, 219);">
        <fieldset>
            <legend>kurs Rupiah Ke Mata Uang Asing</legend>
                <table>
                    <thead>
                        <th>Masukan Nilai</th>
                        <th>Valas</th>
                        <th>Nilai Rupiah</th>
                    </thead>
                    <tbody>
                        <td><input type="number" id="uang"></td>
                            <td>
                                <select id="pilih">
                                    <option></option>
                                    <option value="USD">Dollar US</option>
                                    <option value="SGD">Dollar Singapura</option>
                                    <option value="MYR">Ringgit Malaysia</option>
                                    <option value="JPY">Yen Jepang</option>
                                    <option value="EUR">Euro</option>
                                    <option value="RYL">Riyal Saudi</option>
                                </select>
                            </td>
                            <td><input type="number" id="konversi"></td>
                    </tbody>
                </table>
            
        </fieldset>
    </form>

    <script>
        let pilih = document.getElementById("pilih");

        pilih.onchange = function() {
            let uang = document.getElementById("uang").value;

            if (pilih.value == "USD") {
                document.getElementById("konversi").value = uang * 9915;
            } else if (pilih.value == "SGD") {
                document.getElementById("konversi").value = uang * 13472;
            } else if (pilih.value == "MYR") {
                document.getElementById("konversi").value = uang * 874;
            } else if (pilih.value == "JPY") {
                document.getElementById("konversi").value = uang * 120;
            } else if (pilih.value == "EUR") {
                document.getElementById("konversi").value = uang * 15888;
            } else if (pilih.value == "RYL") {
                document.getElementById("konversi").value = uang * 3592;
            } else {
                document.getElementById("konversi").value = "Anda  Tidak Punya Uang";
            }
        }
    </script>
</body>
</html>
